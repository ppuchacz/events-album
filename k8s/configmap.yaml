apiVersion: v1
kind: ConfigMap
metadata:
  name: events-album-config
  labels:
    app.kubernetes.io/name: events-album
    app.kubernetes.io/part-of: events-album
data:
  APP_ENV: "prod"
  APP_DEBUG: "0"
  CORS_ALLOW_ORIGIN: "^https?://.*$"
  POSTGRES_DB: "events_album"
  POSTGRES_USER: "app"
  DATABASE_HOST: "database"
  DATABASE_PORT: "5432"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_DEFAULT_USER: "guest"
