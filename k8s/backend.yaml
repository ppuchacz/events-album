apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: events-album
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: events-album
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  selector:
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: events-album
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: events-album
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: events-album
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: events-album
    spec:
      initContainers:
        - name: wait-for-database-and-mq
          image: events-album-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - php
            - -r
            - |
              $check = function ($host, $port, $name) {
                  echo "Waiting for $name at $host:$port...\n";
                  for ($i = 0; $i < 60; $i++) {
                      $fp = @fsockopen($host, $port, $errno, $errstr, 2);
                      if ($fp) {
                          fclose($fp);
                          echo "$name is ready!\n";
                          return true;
                      }
                      sleep(2);
                  }
                  echo "$name connection timed out!\n";
                  exit(1);
              };
              $check('database', 5432, 'Database');
              $check('rabbitmq', 5672, 'RabbitMQ');
      containers:
        - name: backend
          image: events-album-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: events-album-config
                  key: APP_ENV
            - name: APP_DEBUG
              valueFrom:
                configMapKeyRef:
                  name: events-album-config
                  key: APP_DEBUG
            - name: CORS_ALLOW_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: events-album-config
                  key: CORS_ALLOW_ORIGIN
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: events-album-secrets
                  key: APP_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: events-album-secrets
                  key: DATABASE_URL
            - name: MESSENGER_TRANSPORT_DSN
              valueFrom:
                secretKeyRef:
                  name: events-album-secrets
                  key: MESSENGER_TRANSPORT_DSN
          volumeMounts:
            - name: uploads-volume
              mountPath: /app/public/uploads
          startupProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: uploads-volume
          persistentVolumeClaim:
            claimName: uploads-pvc
