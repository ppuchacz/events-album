apiVersion: v1
kind: ResourceQuota
metadata:
  name: events-album-quota
  labels:
    app.kubernetes.io/name: events-album
    app.kubernetes.io/part-of: events-album
spec:
  hard:
    requests.cpu: "4000m"
    requests.memory: "6Gi"
    limits.cpu: "16000m"
    limits.memory: "16Gi"
    pods: "20"
    persistentvolumeclaims: "5"
    requests.storage: "15Gi"
