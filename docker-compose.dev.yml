services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events_album
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d events_album"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: cb72114bd20eda894516147d52b21f8b
      DATABASE_URL: "postgresql://app:app@database:5432/events_album?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
      CORS_ALLOW_ORIGIN: "^https?://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
    ports:
      - "8000:8000"
    volumes:
      - uploads_dev:/app/public/uploads
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      target: dev
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600"]
    restart: unless-stopped
    environment:
      APP_ENV: dev
      APP_SECRET: cb72114bd20eda894516147d52b21f8b
      DATABASE_URL: "postgresql://app:app@database:5432/events_album?serverVersion=16&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
    volumes:
      - uploads_dev:/app/public/uploads
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8000"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata_dev:
  uploads_dev:
